[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexlexhub"
version = "2.0.0"
description = "AI-powered legal intelligence and RAG platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20.0",
  "aiohttp>=3.10.10",
  "alembic>=1.13.2",
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.12.3",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "httpx>=0.27.2",
  "pgvector>=0.3.5",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.0",
  "pypdf>=5.1.0",
  "python-json-logger>=2.0.7",
  "python-multipart>=0.0.12",
  "redis>=5.1.1",
  "sqlalchemy>=2.0.36",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[project.scripts]
nexlexhub-api = "nexlexhub.api.main:run"
nexlexhub-seed = "nexlexhub.scripts.seed_demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "Assets",
  "Pharse_1/Core_pipeline.py",
  "Pharse_1/Neural_Scheme.py",
  "Pharse_1/Processing",
  "Pharse_1/Scraper/Data",
  "Pharse_1/Scraper/Script",
  "tools",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
