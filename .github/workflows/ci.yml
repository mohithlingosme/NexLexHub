name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: nexlexhub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d nexlexhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      NEXLEXHUB_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/nexlexhub
      NEXLEXHUB_SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/nexlexhub
      NEXLEXHUB_ALLOWED_KEYS: dev-api-key:admin
      NEXLEXHUB_ENABLE_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: ruff check .
      - run: mypy src
      - run: pytest
